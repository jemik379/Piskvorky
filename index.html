<script id="engine-src" type="text/plain">
'use strict';
/* ===== Piškvorky trenér – jádro (deska + AI), čisté JavaScript ===== */
const BLACK = 1, WHITE = 2, EMPTY = 0;
const W = [0, 1, 8, 60, 600, 100000];
const DX = [1, 0, 1, 1], DY = [0, 1, 1, -1];
const WIN = 1000000, INF = 2000000, MAX_PLY = 64, CAP = 19 * 19;
const TT_BITS = 20, TT_SIZE = 1 << TT_BITS;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) | 0;
  };
}
const ZRND = mulberry32(0x5EED1234);
const Z1 = new Int32Array(2 * 19 * 19 + 2), Z2 = new Int32Array(2 * 19 * 19 + 2);
for (let i = 0; i < Z1.length; i++) { Z1[i] = ZRND(); Z2[i] = ZRND(); }
const ZS1 = ZRND(), ZS2 = ZRND();

const TOPO = {};
function topo(n) {
  if (TOPO[n]) return TOPO[n];
  const n2 = n * n;
  const winCells = new Int32Array(4 * n2 * 5);
  const pos = new Int32Array(n2);
  const mid = (n / 2) | 0;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    pos[y * n + x] = Math.max(0, 7 - Math.max(Math.abs(x - mid), Math.abs(y - mid)));
  }
  const lists = [];
  for (let i = 0; i < n2; i++) lists.push([]);
  for (let d = 0; d < 4; d++) {
    for (let sy = 0; sy < n; sy++) for (let sx = 0; sx < n; sx++) {
      const ex = sx + DX[d] * 4, ey = sy + DY[d] * 4;
      if (ex < 0 || ey < 0 || ex >= n || ey >= n) continue;
      const wid = d * n2 + sy * n + sx;
      for (let k = 0; k < 5; k++) {
        const cell = (sy + DY[d] * k) * n + sx + DX[d] * k;
        lists[cell].push(wid);
        winCells[wid * 5 + k] = cell;
      }
    }
  }
  const cw = lists.map(l => Int32Array.from(l));
  return (TOPO[n] = { cw, winCells, pos });
}

class Board {
  constructor(n) {
    this.n = n;
    const n2 = this.n2 = n * n;
    this.c = new Int8Array(n2);
    this.hist = new Int32Array(n2);
    this.histCol = new Int8Array(n2);
    this.cnt = 0;
    this.stm = BLACK;
    this.exactFive = false;
    this.h1 = 0; this.h2 = 0;
    this.near = new Int32Array(n2);
    this.total = 0;
    this.wc = new Int32Array(12);
    this.threatCount = 0;
    const tp = topo(n);
    this.cw = tp.cw; this.winCells = tp.winCells; this.pos = tp.pos;
    this.gB = new Int32Array(n2); this.gW = new Int32Array(n2);
    this.posTotal = 0;
    this.wb = new Int8Array(4 * n2); this.ww = new Int8Array(4 * n2);
    this.mark = new Int32Array(n2);
    this.stamp = 0;
  }
  turn() { return this.stm; }
  lastMove() { return this.cnt > 0 ? this.hist[this.cnt - 1] : -1; }
  inside(x, y) { return x >= 0 && y >= 0 && x < this.n && y < this.n; }
  static name(cell, n) { return String.fromCharCode(65 + cell % n) + (((cell / n) | 0) + 1); }
  setTurn(col) {
    if (col !== this.stm) { this.h1 ^= ZS1; this.h2 ^= ZS2; this.stm = col; }
  }
  copy() {
    const b = new Board(this.n);
    b.exactFive = this.exactFive;
    for (let k = 0; k < this.cnt; k++) b.placeAs(this.hist[k], this.histCol[k]);
    b.setTurn(this.stm);
    return b;
  }
  place(i) { this.placeAs(i, this.stm); }
  placeAs(i, col) {
    const n = this.n;
    this.c[i] = col;
    this.hist[this.cnt] = i;
    this.histCol[this.cnt] = col;
    this.cnt++;
    const zi = i * 2 + col - 1;
    this.h1 ^= Z1[zi]; this.h2 ^= Z2[zi];
    this.posTotal += col === BLACK ? this.pos[i] : -this.pos[i];
    this.setTurn(3 - col);
    const x = i % n, y = (i / n) | 0;
    for (let dy = -2; dy <= 2; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= n) continue;
      for (let dx = -2; dx <= 2; dx++) {
        const xx = x + dx;
        if (xx >= 0 && xx < n) this.near[yy * n + xx]++;
      }
    }
    const ws = this.cw[i];
    for (let k = 0; k < ws.length; k++) this.addStone(ws[k], col);
  }
  undo() {
    const n = this.n;
    this.cnt--;
    const i = this.hist[this.cnt];
    const col = this.histCol[this.cnt];
    this.c[i] = EMPTY;
    const zi = i * 2 + col - 1;
    this.h1 ^= Z1[zi]; this.h2 ^= Z2[zi];
    this.posTotal -= col === BLACK ? this.pos[i] : -this.pos[i];
    this.setTurn(col);
    const x = i % n, y = (i / n) | 0;
    for (let dy = -2; dy <= 2; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= n) continue;
      for (let dx = -2; dx <= 2; dx++) {
        const xx = x + dx;
        if (xx >= 0 && xx < n) this.near[yy * n + xx]--;
      }
    }
    const ws = this.cw[i];
    for (let k = 0; k < ws.length; k++) this.removeStone(ws[k], col);
  }
  changeWindow(wid, nb, nw) {
    const wc = this.wc;
    const b = this.wb[wid], w = this.ww[wid];
    if (b > 0 && w === 0) { this.total -= W[b]; wc[b]--; }
    else if (w > 0 && b === 0) { this.total += W[w]; wc[6 + w]--; }
    if (nb > 0 && nw === 0) { this.total += W[nb]; wc[nb]++; }
    else if (nw > 0 && nb === 0) { this.total -= W[nw]; wc[6 + nw]++; }
    const dB = ((nw === 0 && nb < 5) ? W[nb + 1] - W[nb] : 0) - ((w === 0 && b < 5) ? W[b + 1] - W[b] : 0);
    const dW = ((nb === 0 && nw < 5) ? W[nw + 1] - W[nw] : 0) - ((b === 0 && w < 5) ? W[w + 1] - W[w] : 0);
    if (dB !== 0 || dW !== 0) {
      const base = wid * 5;
      for (let k = 0; k < 5; k++) {
        const cell = this.winCells[base + k];
        this.gB[cell] += dB;
        this.gW[cell] += dW;
      }
    }
    this.wb[wid] = nb;
    this.ww[wid] = nw;
  }
  addStone(wid, col) {
    if (col === BLACK) this.changeWindow(wid, this.wb[wid] + 1, this.ww[wid]);
    else this.changeWindow(wid, this.wb[wid], this.ww[wid] + 1);
  }
  removeStone(wid, col) {
    if (col === BLACK) this.changeWindow(wid, this.wb[wid] - 1, this.ww[wid]);
    else this.changeWindow(wid, this.wb[wid], this.ww[wid] - 1);
  }
  run(i, d, sgn, color) {
    const n = this.n;
    const dx = DX[d] * sgn, dy = DY[d] * sgn;
    let x = i % n + dx, y = ((i / n) | 0) + dy;
    let r = 0;
    while (x >= 0 && y >= 0 && x < n && y < n && this.c[y * n + x] === color) { r++; x += dx; y += dy; }
    return r;
  }
  wins(i) {
    const color = this.c[i];
    if (color === EMPTY) return false;
    for (let d = 0; d < 4; d++) {
      const len = 1 + this.run(i, d, 1, color) + this.run(i, d, -1, color);
      if (this.exactFive ? len === 5 : len >= 5) return true;
    }
    return false;
  }
  winLine(i) {
    const color = this.c[i], n = this.n;
    if (color === EMPTY) return null;
    for (let d = 0; d < 4; d++) {
      const a = this.run(i, d, -1, color), b = this.run(i, d, 1, color);
      const len = 1 + a + b;
      if (this.exactFive ? len === 5 : len >= 5) {
        return [i % n - DX[d] * a, ((i / n) | 0) - DY[d] * a, DX[d], DY[d], len];
      }
    }
    return null;
  }
  makesFive(i, color) {
    for (let d = 0; d < 4; d++) {
      const len = 1 + this.run(i, d, 1, color) + this.run(i, d, -1, color);
      if (this.exactFive ? len === 5 : len >= 5) return true;
    }
    return false;
  }
  mine(color) { return color === BLACK ? this.wb : this.ww; }
  theirs(color) { return color === BLACK ? this.ww : this.wb; }
  emptyIn(wid, skip) {
    const n = this.n, n2 = this.n2;
    const d = (wid / n2) | 0, s = wid % n2;
    const sx = s % n, sy = (s / n) | 0;
    for (let k = 0; k < 5; k++) {
      const cell = (sy + DY[d] * k) * n + sx + DX[d] * k;
      if (this.c[cell] === EMPTY && cell !== skip) return cell;
    }
    return -1;
  }
  fiveCells(color, out) {
    if (this.wc[(color - 1) * 6 + 4] === 0) return 0;
    const m = this.mine(color), t = this.theirs(color);
    let k = 0;
    const lim = 4 * this.n2;
    for (let wid = 0; wid < lim; wid++) {
      if (m[wid] === 4 && t[wid] === 0) {
        const e = this.emptyIn(wid, -1);
        if (e < 0) continue;
        if (this.exactFive && !this.makesFive(e, color)) continue;
        if (k === 1 && out[0] === e) continue;
        out[k++] = e;
        if (k >= 2) break;
      }
    }
    return k;
  }
  /** Obraz pole cell při transformaci t (0 = identita, 1–3 otočení, 4–7 zrcadlení) kolem středu desky. */
  transform(t, cell) {
    const n = this.n, m = n - 1, x = cell % n, y = (cell / n) | 0;
    let nx, ny;
    switch (t) {
      case 0: nx = x; ny = y; break;
      case 1: nx = m - y; ny = x; break;
      case 2: nx = m - x; ny = m - y; break;
      case 3: nx = y; ny = m - x; break;
      case 4: nx = m - x; ny = y; break;
      case 5: nx = x; ny = m - y; break;
      case 6: nx = y; ny = x; break;
      default: nx = m - y; ny = m - x;
    }
    return ny * n + nx;
  }
  /**
   * Symetrie pozice: pro každé pole vrátí reprezentanta jeho třídy (nejmenší index mezi poli,
   * která jsou si v dané pozici symetricky rovnocenná). Když pozice nemá žádnou symetrii, vrací null.
   */
  symRep() {
    const ok = [];
    for (let t = 1; t < 8; t++) {
      let good = true;
      for (let k = 0; k < this.cnt; k++) {
        if (this.c[this.transform(t, this.hist[k])] !== this.histCol[k]) { good = false; break; }
      }
      if (good) ok.push(t);
    }
    if (!ok.length) return null;
    const rep = new Int32Array(this.n2);
    for (let cell = 0; cell < this.n2; cell++) {
      let m = cell;
      for (const t of ok) m = Math.min(m, this.transform(t, cell));
      rep[cell] = m;
    }
    return rep;
  }
  threePlus(color) { const b = (color - 1) * 6; return this.wc[b + 3] + this.wc[b + 4]; }
  threes(color) { return this.wc[(color - 1) * 6 + 3]; }
  gain(i, color) { return color === BLACK ? this.gB[i] : this.gW[i]; }
  maxGain(color) {
    const g = color === BLACK ? this.gB : this.gW;
    let best = 0;
    for (let i = 0; i < this.n2; i++) {
      if (this.c[i] === EMPTY && this.near[i] > 0 && g[i] > best) best = g[i];
    }
    return best;
  }
  makesFour(i, color) {
    const m = this.mine(color), t = this.theirs(color), ws = this.cw[i];
    for (let k = 0; k < ws.length; k++) {
      const wid = ws[k];
      if (t[wid] === 0 && m[wid] >= 3) return true;
    }
    return false;
  }
  makesThree(i, color) {
    const m = this.mine(color), t = this.theirs(color), ws = this.cw[i];
    for (let k = 0; k < ws.length; k++) {
      const wid = ws[k];
      if (t[wid] === 0 && m[wid] === 2) return true;
    }
    return false;
  }
  fourCompletions(i, color) {
    const m = this.mine(color), t = this.theirs(color), ws = this.cw[i];
    let first = -1, found = 0;
    for (let k = 0; k < ws.length; k++) {
      const wid = ws[k];
      if (t[wid] === 0 && m[wid] === 3) {
        const e = this.emptyIn(wid, i);
        if (e < 0) continue;
        if (found === 0) { first = e; found = 1; }
        else if (e !== first) return 2;
      }
    }
    return found;
  }
  threatScan(color, def) {
    const n = this.n, n2 = this.n2;
    const m = this.mine(color), t = this.theirs(color);
    let nd = 0;
    this.stamp++;
    const lim = 4 * n2;
    for (let wid = 0; wid < lim; wid++) {
      if (m[wid] === 3 && t[wid] === 0) {
        const d = (wid / n2) | 0, s = wid % n2;
        const sx = s % n, sy = (s / n) | 0;
        for (let k = 0; k < 5; k++) {
          const cell = (sy + DY[d] * k) * n + sx + DX[d] * k;
          if (this.c[cell] === EMPTY && this.mark[cell] !== this.stamp) {
            this.mark[cell] = this.stamp;
            def[nd++] = cell;
          }
        }
      }
    }
    let tc = 0;
    for (let q = 0; q < nd; q++) if (this.fourCompletions(def[q], color) >= 2) tc++;
    this.threatCount = tc;
    return nd;
  }
}

function sortDesc(m, s, n) {
  for (let i = 1; i < n; i++) {
    const mm = m[i], ss = s[i];
    let j = i - 1;
    while (j >= 0 && s[j] < ss) { m[j + 1] = m[j]; s[j + 1] = s[j]; j--; }
    m[j + 1] = mm; s[j + 1] = ss;
  }
}
/** Ponechá z kandidátů jen reprezentanty symetrických tříd. */
function compactSym(rm, rs, nr, rep) {
  if (!rep) return nr;
  let k = 0;
  for (let j = 0; j < nr; j++) if (rep[rm[j]] === rm[j]) { rm[k] = rm[j]; rs[k] = rs[j]; k++; }
  return k;
}
function toTT(s, ply) { if (s > WIN - 1000) return s + ply; if (s < -WIN + 1000) return s - ply; return s; }
function fromTT(s, ply) { if (s > WIN - 1000) return s - ply; if (s < -WIN + 1000) return s + ply; return s; }
const now = () => Date.now();
const mk = (rows, cols, T) => { const a = []; for (let i = 0; i < rows; i++) a.push(new T(cols)); return a; };

class Engine {
  constructor() {
    this.b = null; this.deadline = 0; this.timeUp = false; this.nodes = 0;
    this.leafVcfDepth = 4; this.leafOpp = 0; this.WA = 12; this.WB = 8; this.WC = 6; this.safeD = 6; this.safeB = 60000; this.safeFrac = 15;
    this.tk1 = new Int32Array(TT_SIZE); this.tk2 = new Int32Array(TT_SIZE);
    this.ts = new Int32Array(TT_SIZE); this.td = new Int8Array(TT_SIZE);
    this.tf = new Int8Array(TT_SIZE); this.tm = new Int16Array(TT_SIZE);
    this.fbuf = mk(MAX_PLY + 2, 2, Int32Array); this.gbuf = mk(MAX_PLY + 2, 2, Int32Array);
    this.mbuf = mk(MAX_PLY + 2, CAP, Int32Array); this.sbuf = mk(MAX_PLY + 2, CAP, Int32Array);
    this.vf = mk(24, 2, Int32Array); this.vg = mk(24, 2, Int32Array);
    this.vcand = mk(24, CAP, Int32Array); this.vsc = mk(24, CAP, Int32Array);
    this.scratch = new Int32Array(CAP); this.mark2 = new Int32Array(CAP); this.stamp2 = 0;
    this.vcfMove = -1;
    this.tcand = mk(24, CAP, Int32Array); this.tsc = mk(24, CAP, Int32Array);
    this.tdef = mk(24, CAP, Int32Array);
    this.tf1 = mk(24, 2, Int32Array); this.tf2 = mk(24, 2, Int32Array);
    this.vctBudget = 0; this.vctMove = -1;
    this.E2 = 8; this.E3 = 80; this.E3o = 50; this.HOT_CAP = 400; this.HOT_ME = 6; this.HOT_OPP = 3; this.POS_W = 6; this.TEMPO = 15;
  }

  setup(src, millis) {
    this.b = src.copy();
    this.timeUp = false;
    this.nodes = 0;
    this.deadline = now() + millis;
    this.tk1.fill(0); this.tk2.fill(0);
  }

  score(cell, stm, opp) {
    return Math.trunc(this.b.gain(cell, stm) * 11 / 10) + this.b.gain(cell, opp);
  }

  evalStm(stm) {
    const b = this.b, wc = b.wc;
    const me = (stm - 1) * 6, op = (2 - stm) * 6;
    let v = wc[me + 1] + this.E2 * wc[me + 2] + this.E3 * wc[me + 3]
      - (wc[op + 1] + this.E2 * wc[op + 2] + this.E3o * wc[op + 3]);
    const hs = Math.min(b.maxGain(stm), this.HOT_CAP), ho = Math.min(b.maxGain(3 - stm), this.HOT_CAP);
    v += Math.trunc((hs * this.HOT_ME - ho * this.HOT_OPP) / 16);
    v += Math.trunc((stm === BLACK ? b.posTotal : -b.posTotal) * this.POS_W / 4);
    return v + this.TEMPO;
  }

  /** Najde nejlepší tah. Vrací {move, score, depth, nodes, mate}. */
  think(src, millis, maxDepth) {
    this.setup(src, millis);
    const b = this.b;
    const res = { move: -1, score: 0, depth: 0, nodes: 0, mate: false };
    const cells = b.n2;
    const stm = b.stm, opp = 3 - stm;
    if (b.cnt === 0) { res.move = ((b.n / 2) | 0) * b.n + ((b.n / 2) | 0); return res; }
    const f = new Int32Array(2);
    if (b.fiveCells(stm, f) > 0) { res.move = f[0]; res.score = WIN - 1; res.mate = true; return res; }
    const no = b.fiveCells(opp, f);
    if (no >= 2) { res.move = f[0]; res.score = -(WIN - 2); res.mate = true; return res; }
    const forcedCell = f[0];
    const rm = new Int32Array(cells), rs = new Int32Array(cells);
    let nr = 0;
    let restricted = false;
    const scratch = this.scratch, mark2 = this.mark2;
    const rep = b.symRep();

    if (no === 0) {
      if (b.threes(stm) > 0) {
        const nd = b.threatScan(stm, scratch);
        if (b.threatCount > 0) {
          for (let q = 0; q < nd; q++) {
            if (b.fourCompletions(scratch[q], stm) >= 2) {
              res.move = scratch[q]; res.score = WIN - 3; res.mate = true; return res;
            }
          }
        }
      }
      if (b.threePlus(stm) > 0) {
        const full = this.deadline;
        this.deadline = now() + Math.floor(millis * 4 / 10);
        const win = this.vcf(stm, 16, true);
        this.deadline = full;
        if (win) { res.move = this.vcfMove; res.score = WIN - 30; res.mate = true; return res; }
        this.timeUp = false;
      }
      if (b.threePlus(stm) > 0 || b.wc[(stm - 1) * 6 + 2] > 0) {
        const full = this.deadline;
        this.deadline = now() + Math.floor(millis * 35 / 100);
        this.vctBudget = 400000;
        const win = this.vctAttack(stm, 8, true);
        this.deadline = full;
        if (win && this.vctMove >= 0) { res.move = this.vctMove; res.score = WIN - 40; res.mate = true; return res; }
        this.timeUp = false;
      }
      if (b.threes(opp) > 0) {
        const nd = b.threatScan(opp, scratch);
        if (b.threatCount > 0) {
          restricted = true;
          this.stamp2++;
          for (let q = 0; q < nd; q++) {
            const cell = scratch[q];
            mark2[cell] = this.stamp2;
            rm[nr] = cell; rs[nr] = this.score(cell, stm, opp); nr++;
          }
          if (b.threes(stm) > 0) {
            for (let i = 0; i < cells; i++) {
              if (b.c[i] === EMPTY && b.near[i] > 0 && mark2[i] !== this.stamp2 && b.makesFour(i, stm)) {
                rm[nr] = i; rs[nr] = this.score(i, stm, opp); nr++;
              }
            }
          }
        }
      }
    }
    if (no === 1) {
      rm[nr++] = forcedCell;
    } else if (!restricted) {
      for (let i = 0; i < cells; i++) {
        if (b.c[i] === EMPTY && b.near[i] > 0) { rm[nr] = i; rs[nr] = this.score(i, stm, opp); nr++; }
      }
      nr = compactSym(rm, rs, nr, rep);
      sortDesc(rm, rs, nr);
      nr = Math.min(nr, 24);
    } else {
      nr = compactSym(rm, rs, nr, rep);
      sortDesc(rm, rs, nr);
    }
    if (nr === 0) return res;
    res.move = rm[0];
    const extend = restricted || no === 1;

    for (let depth = 1; depth <= maxDepth; depth++) {
      let alpha = -INF, bestS = -INF, bestM = -1, bestJ = -1;
      for (let j = 0; j < nr; j++) {
        const m = rm[j];
        b.place(m);
        const nd = extend ? depth : depth - 1;
        let v;
        if (j === 0) {
          v = -this.search(nd, -INF, INF, 1);
        } else {
          v = -this.search(nd, -alpha - 1, -alpha, 1);
          if (v > alpha && !this.timeUp) v = -this.search(nd, -INF, -alpha, 1);
        }
        b.undo();
        if (this.timeUp) break;
        rs[j] = v;
        if (v > bestS) { bestS = v; bestM = m; bestJ = j; }
        if (v > alpha) alpha = v;
      }
      if (this.timeUp) break;
      res.move = bestM; res.score = bestS; res.depth = depth;
      res.mate = Math.abs(bestS) > WIN - 200;
      rs[bestJ] = INF;
      sortDesc(rm, rs, nr);
      rs[0] = bestS;
      if (res.mate || (nr === 1 && depth >= 3)) break;
    }
    this.safeMove(res, rm, nr, millis, stm, opp);
    res.nodes = this.nodes;
    return res;
  }

  /**
   * Hodnocení jednoho odehraného tahu: nejlepší tah a jeho skóre vs. skóre odehraného tahu
   * (hledané do stejné hloubky s plným oknem). Symetricky rovnocenné tahy mají stejné skóre.
   */
  reviewMove(src, millis, played) {
    const r = this.think(src, millis, 30);
    const b = this.b;
    const out = { best: r.move, bestScore: r.score, playedScore: r.score, depth: r.depth, equal: true };
    if (r.move < 0 || played < 0 || played === r.move) return out;
    if (b.c[played] !== EMPTY) return out;
    const rep = b.symRep();
    if (rep && rep[played] === rep[r.move]) return out;
    out.equal = false;
    this.timeUp = false;
    this.deadline = now() + Math.max(200, Math.floor(millis * 0.6));
    const d = Math.max(r.depth, 3);
    const target = rep ? rep[played] : played;   // symetrické tahy se hledají jako jeden a ten samý
    b.place(target);
    const v = b.wins(target) ? WIN - 1 : -this.search(d - 1, -INF, INF, 1);
    b.undo();
    if (!this.timeUp) out.playedScore = v;
    return out;
  }

  safeMove(res, rm, nr, millis, stm, opp) {
    const b = this.b;
    if (res.mate || res.move < 0) return res;
    const full = this.deadline;
    const oldUp = this.timeUp;
    this.timeUp = false;
    this.deadline = now() + Math.max(80, Math.floor(millis * this.safeFrac / 100));
    let tried = 0;
    const order = [res.move];
    for (let j = 0; j < nr && order.length < Math.min(nr, 8) + 1; j++) if (rm[j] !== res.move) order.push(rm[j]);
    let chosen = res.move;
    for (let j = 0; j < order.length && tried < 6; j++) {
      const m = order[j];
      b.place(m);
      let lose = false;
      if (!b.wins(m)) { this.vctBudget = this.safeB; lose = this.vctAttack(opp, this.safeD, false); }
      b.undo();
      tried++;
      if (this.timeUp) break;
      if (!lose) { chosen = m; break; }
      if (j === 0) res.score = Math.min(res.score, -(WIN - 60));
    }
    this.deadline = full;
    this.timeUp = oldUp;
    if (chosen !== res.move) { res.move = chosen; res.mate = false; res.score = 0; }
    return res;
  }

  /** Analýza: přesné skóre nejlepších kandidátů. Vrací {moves, scores, depth, mate}. */
  analyze(src, millis, topK) {
    this.setup(src, millis);
    const b = this.b;
    const out = { moves: [], scores: [], depth: 0, mate: false };
    const cells = b.n2;
    const stm = b.stm, opp = 3 - stm;
    const f = new Int32Array(2);
    const scratch = this.scratch, mark2 = this.mark2;
    if (b.cnt === 0) { out.moves = [((b.n / 2) | 0) * b.n + ((b.n / 2) | 0)]; out.scores = [0]; return out; }
    if (b.fiveCells(stm, f) > 0) { out.moves = [f[0]]; out.scores = [WIN - 1]; out.mate = true; return out; }
    const no = b.fiveCells(opp, f);
    if (no >= 2) { out.moves = [f[0]]; out.scores = [-(WIN - 2)]; out.mate = true; return out; }
    const rm = new Int32Array(cells), rs = new Int32Array(cells);
    let nr = 0;
    let extend = no === 1;
    const rep = b.symRep();
    if (no === 1) {
      rm[nr++] = f[0];
    } else {
      if (b.threes(stm) > 0) {
        const nd = b.threatScan(stm, scratch);
        if (b.threatCount > 0) {
          for (let q = 0; q < nd; q++) {
            if (b.fourCompletions(scratch[q], stm) >= 2) {
              out.moves = [scratch[q]]; out.scores = [WIN - 3]; out.mate = true; return out;
            }
          }
        }
      }
      if (b.threePlus(stm) > 0) {
        const full = this.deadline;
        this.deadline = now() + Math.floor(millis * 3 / 10);
        const win = this.vcf(stm, 16, true);
        this.deadline = full;
        if (win) { out.moves = [this.vcfMove]; out.scores = [WIN - 30]; out.mate = true; return out; }
        this.timeUp = false;
      }
      let restricted = false;
      if (b.threes(opp) > 0) {
        const nd = b.threatScan(opp, scratch);
        if (b.threatCount > 0) {
          restricted = true;
          extend = true;
          this.stamp2++;
          for (let q = 0; q < nd; q++) {
            mark2[scratch[q]] = this.stamp2;
            rm[nr] = scratch[q]; rs[nr] = this.score(scratch[q], stm, opp); nr++;
          }
          if (b.threes(stm) > 0) {
            for (let i = 0; i < cells; i++) {
              if (b.c[i] === EMPTY && b.near[i] > 0 && mark2[i] !== this.stamp2 && b.makesFour(i, stm)) {
                rm[nr] = i; rs[nr] = this.score(i, stm, opp); nr++;
              }
            }
          }
        }
      }
      if (!restricted) {
        for (let i = 0; i < cells; i++) {
          if (b.c[i] === EMPTY && b.near[i] > 0) { rm[nr] = i; rs[nr] = this.score(i, stm, opp); nr++; }
        }
      }
      nr = compactSym(rm, rs, nr, rep);
      sortDesc(rm, rs, nr);
      nr = Math.min(nr, 14);
    }
    if (nr === 0) return out;
    const sc = new Int32Array(nr);
    out.moves = [rm[0]];
    out.scores = [0];
    for (let depth = 1; depth <= 20; depth++) {
      let done = true;
      for (let j = 0; j < nr; j++) {
        b.place(rm[j]);
        const v = -this.search(extend ? depth : depth - 1, -INF, INF, 1);
        b.undo();
        if (this.timeUp) { done = false; break; }
        sc[j] = v;
      }
      if (!done) break;
      const mm = Int32Array.from(rm.subarray(0, nr)), ss = Int32Array.from(sc);
      sortDesc(mm, ss, nr);
      const k = Math.min(topK, nr);
      out.moves = Array.from(mm.subarray(0, k));
      out.scores = Array.from(ss.subarray(0, k));
      out.equiv = out.moves.map(mv => {
        const eq = [];
        if (rep) for (let c = 0; c < cells; c++) if (c !== mv && b.c[c] === EMPTY && rep[c] === rep[mv]) eq.push(c);
        return eq;
      });
      out.depth = depth;
      out.mate = Math.abs(ss[0]) > WIN - 200;
      rm.set(mm, 0); sc.set(ss, 0);
      if (out.mate) break;
    }
    return out;
  }

  /* ===== Puzzly: důkaz vynucené výhry (útočník: čtyřky a trojky; obránce zkouší VŠECHNY tahy) ===== */
  pzInit() {
    if (this.pzReady) return;
    this.pzReady = true;
    this.pzC = mk(64, CAP, Int32Array); this.pzS = mk(64, CAP, Int32Array); this.pzF = mk(64, 4, Int32Array);
    this.pzMaps = {}; this.pzNodes = 0; this.pzLimit = 0; this.pzAbort = false; this.pzSize = 0;
  }
  pzSet(src) { this.pzInit(); this.b = src.copy(); this.b.exactFive = false; this.b.setTurn(BLACK); this.pzClear(); }
  pzClear() { this.pzMaps = {}; this.pzSize = 0; }
  pzGet(kind, att, d) {
    const k = kind * 100 + att * 30 + d;
    return this.pzMaps[k] || (this.pzMaps[k] = new Map());
  }
  pzKey() {
    const b = this.b;
    let h1 = b.h1, h2 = b.h2;
    if (b.stm === WHITE) { h1 ^= ZS1; h2 ^= ZS2; }
    return (h1 >>> 0) * 2097152 + ((h2 >>> 0) & 0x1FFFFF);
  }
  pzWinAtt(att, d, lvl) {
    const b = this.b;
    if (d < 1) return false;
    if (++this.pzNodes > this.pzLimit) { this.pzAbort = true; return false; }
    const f = this.pzF[lvl], def = 3 - att;
    if (b.fiveCells(att, f) > 0) return true;
    const kd = b.fiveCells(def, f);
    if (kd >= 2 || d < 2) return false;
    const tt = this.pzGet(0, att, d), key = this.pzKey();
    const hit = tt.get(key);
    if (hit !== undefined) return hit;
    let res = false;
    if (kd === 1) {
      const c = f[0];
      b.placeAs(c, att);
      res = this.pzDefAll(att, d - 1, lvl + 1);
      b.undo();
    } else {
      const cand = this.pzC[lvl], sc = this.pzS[lvl];
      let nc = 0;
      const n2 = b.n2;
      for (let c = 0; c < n2; c++) {
        if (b.c[c] !== EMPTY || b.near[c] === 0) continue;
        const four = b.makesFour(c, att);
        if (!four && !b.makesThree(c, att)) continue;
        const s = (four ? 100000 : 0) + b.gain(c, att) * 2 + b.gain(c, def);
        let q = nc++;
        while (q > 0 && sc[q - 1] < s) { sc[q] = sc[q - 1]; cand[q] = cand[q - 1]; q--; }
        sc[q] = s; cand[q] = c;
      }
      if (nc > 26) nc = 26;
      for (let q = 0; q < nc && !res; q++) {
        const c = cand[q];
        b.placeAs(c, att);
        res = this.pzDefAll(att, d - 1, lvl + 1);
        b.undo();
        if (this.pzAbort) return false;
      }
    }
    if (!this.pzAbort) tt.set(key, res);
    return res;
  }
  pzDefAll(att, d, lvl) {
    const b = this.b, def = 3 - att;
    if (++this.pzNodes > this.pzLimit) { this.pzAbort = true; return false; }
    const f = this.pzF[lvl];
    if (b.fiveCells(def, f) > 0) return false;
    const ka = b.fiveCells(att, f);
    if (ka >= 2) return true;
    const tt = this.pzGet(1, att, d), key = this.pzKey();
    const hit = tt.get(key);
    if (hit !== undefined) return hit;
    let res;
    if (ka === 1) {
      const c = f[0];
      b.placeAs(c, def);
      res = this.pzWinAtt(att, d, lvl + 1);
      b.undo();
    } else if (!this.pzWinAtt(att, d, lvl + 1)) {
      res = false;
    } else {
      res = true;
      const cand = this.pzC[lvl], sc = this.pzS[lvl];
      let nc = 0;
      const n2 = b.n2;
      for (let c = 0; c < n2; c++) {
        if (b.c[c] !== EMPTY || b.near[c] === 0) continue;
        const s = b.gain(c, att) * 2 + b.gain(c, def) + (b.makesFour(c, def) ? 5000 : 0);
        let q = nc++;
        while (q > 0 && sc[q - 1] < s) { sc[q] = sc[q - 1]; cand[q] = cand[q - 1]; q--; }
        sc[q] = s; cand[q] = c;
      }
      for (let q = 0; q < nc && res; q++) {
        const c = cand[q];
        b.placeAs(c, def);
        if (!this.pzWinAtt(att, d, lvl + 1)) res = false;
        b.undo();
        if (this.pzAbort) return false;
      }
    }
    if (!this.pzAbort) tt.set(key, res);
    return res;
  }
  /** Nejmenší počet tahů útočníka k vynucené výhře (-1 žádná do maxD, -2 vyčerpán limit uzlů). */
  pzMinDepth(att, maxD, limit) {
    this.pzNodes = 0; this.pzLimit = limit; this.pzAbort = false;
    for (let d = 1; d <= maxD; d++) {
      if (this.pzWinAtt(att, d, 0)) return d;
      if (this.pzAbort) return -2;
    }
    return -1;
  }
  /** Všechny první tahy útočníka, po nichž stále vyhrává do d tahů. */
  pzFirstMoves(att, d, limit) {
    const b = this.b, out = [], def = 3 - att;
    this.pzNodes = 0; this.pzLimit = limit; this.pzAbort = false;
    const f = this.pzF[0];
    if (b.fiveCells(att, f) > 0) { const k = b.fiveCells(att, f); for (let i = 0; i < k; i++) out.push(f[i]); return out; }
    const kd = b.fiveCells(def, f);
    if (kd >= 2) return out;
    const cs = [];
    if (kd === 1) cs.push(f[0]);
    else for (let c = 0; c < b.n2; c++) {
      if (b.c[c] === EMPTY && b.near[c] > 0 && (b.makesFour(c, att) || b.makesThree(c, att))) cs.push(c);
    }
    for (const c of cs) {
      b.placeAs(c, att);
      const ok = d >= 2 && this.pzDefAll(att, d - 1, 1);
      b.undo();
      if (this.pzAbort) return null;
      if (ok) out.push(c);
    }
    return out;
  }
  /** Nejlepší (nejvíce vzdorující) odpověď obránce; d = zbývající tahy útočníka. */
  pzDefenderMove(att, d, limit) {
    const b = this.b, def = 3 - att;
    const f = this.pzF[0];
    if (b.fiveCells(def, f) > 0) return { move: f[0], md: 99 };
    const ka = b.fiveCells(att, f);
    if (ka >= 1) return { move: f[0], md: 1, forced: true };
    const cells = [];
    for (let c = 0; c < b.n2; c++) {
      if (b.c[c] !== EMPTY || b.near[c] === 0) continue;
      cells.push([b.gain(c, att) * 2 + b.gain(c, def) + (b.makesFour(c, def) ? 5000 : 0), c]);
    }
    cells.sort((a, z) => z[0] - a[0]);
    let best = -1, bm = -1, bs = -1;
    for (const [s, c] of cells) {
      b.placeAs(c, def);
      this.pzNodes = 0; this.pzLimit = limit; this.pzAbort = false;
      let md = 99;
      for (let k = 1; k <= d; k++) { if (this.pzWinAtt(att, k, 1)) { md = k; break; } if (this.pzAbort) break; }
      b.undo();
      if (md > best || (md === best && s > bs)) { best = md; bm = c; bs = s; }
    }
    return { move: bm, md: best };
  }

  /* ===== Generátor puzzlů: náhodná pozice + důkaz řešiče + filtr kvality ===== */
  pzRandomPos(rnd) {
    const N = 15, ri = n => Math.floor(rnd() * n);
    const R = 6 + ri(3), ox = ri(N - R + 1), oy = ri(N - R + 1);
    const att = 1 + ri(2);
    const na = 4 + ri(4);
    const aN = na, dN = att === 1 ? na : na + 1;
    const occ = new Set(), A = [], D = [];
    const cell = () => (oy + ri(R)) * N + ox + ri(R);
    const near = list => {
      const s = list[ri(list.length)];
      const x = (s % N) + ri(5) - 2, y = ((s / N) | 0) + ri(5) - 2;
      return (x < 0 || y < 0 || x >= N || y >= N) ? -1 : y * N + x;
    };
    const put = (list, pf, pn) => {
      let c = -1, k = 0;
      do { c = (pn.length && rnd() < pf) ? near(pn) : cell(); k++; } while ((c < 0 || occ.has(c)) && k < 30);
      if (c < 0 || occ.has(c)) return false;
      occ.add(c); list.push(c); return true;
    };

  pzStones(b) { const a = []; for (let k = 0; k < b.cnt; k++) a.push(b.hist[k], b.histCol[k]); return a; }

  pzJudge(b, att, d) {

    if (dd !== d) return null;

    if (!mv || mv.length < 1 || mv.length > (d <= 2 ? 3 : 2)) return null;

      kinds.push(bb.makesFour(c, att) ? 'F' : 'T');
      bb.placeAs(c, att); bb.setTurn(3 - att);
      left--;
      if (left < 1) break;

      bb.placeAs(r.move, 3 - att); bb.setTurn(att);

      for (let q = 0; q < ws.length; q++) if (mi[ws[q]] === 4 && th[ws[q]] === 0) dirs.add((ws[q] / bb0.n2) | 0);

      else { theme = 'Otevřená trojka → otevřená čtyřka'; idea = 'Otevřenou trojku prodluž na otevřenou čtyřku – ta má dvě vítězná pole a nejde zablokovat.'; }
    } else if (!s.includes('T')) {

    } else if (kinds[0] === 'T') {

    } else {
      theme = 'Čtyřka a pak trojka (4-3)'; idea = 'Čtyřkou vynutíš odpověď, a tím připravíš pole, odkud vznikne čtyřka spolu s otevřenou trojkou.';

  pzMutate(b, att, rnd) {

  /** Vygeneruje novou úlohu s hloubkou dmin..dmax do ms milisekund (null = nepodařilo se). */
  pzGenerate(seed, dmin, dmax, ms) {

        if (!nb) continue;

        if (d >= climb.d && d > 0) { if (d > climb.d || rnd() < 0.5) { climb = { b: nb, att: climb.att, d }; } } else continue;

  search(depth, alpha, beta, ply) {
    const b = this.b;
    this.nodes++;

    if (this.timeUp) return 0;

    const stm = b.stm, opp = 3 - stm;

    if (b.cnt >= b.n2) return 0;
    if (ply >= MAX_PLY - 2) return this.evalStm(stm);

    const forced = no === 1;
    let restricted = false;
    let ndef = 0;
    const scratch = this.scratch;
    if (!forced) {
      if (b.threes(stm) > 0) {
        b.threatScan(stm, scratch);
        if (b.threatCount > 0) return WIN - ply - 2;
      }

    if (depth <= 0 && !forced && !restricted) {
      if (this.leafVcfDepth > 0 && b.threePlus(stm) > 0 && this.vcf(stm, this.leafVcfDepth, false)) {
        return this.timeUp ? 0 : WIN - ply - 2;

        b.setTurn(stm);

          for (let j = 0; j < lim2 && !defended; j++) {

            const t1 = cm[j]; cm[j] = cm[bi]; cm[bi] = t1;
            const t2 = cs[j]; cs[j] = cs[bi]; cs[bi] = t2;
            b.place(cm[j]);
            const wins = b.wins(cm[j]);
            let bad = false;
            if (!wins && b.threePlus(opp) > 0) bad = this.vcf(opp, this.leafOpp, false);

            if (this.timeUp) return 0;

  vctAttack(att, depth, top) {

      let bi = j;
      for (let k = j + 1; k < nc; k++) if (sc[k] > sc[bi]) bi = k;
      const t1 = cand[j]; cand[j] = cand[bi]; cand[bi] = t1;
      const t2 = sc[j]; sc[j] = sc[bi]; sc[bi] = t2;

      b.place(m);

      if (na >= 2) ok = true;

  vctDefend(att, depth) {

    for (let q = 0; q < nd; q++) { opts[no++] = scratch[q]; mark2[scratch[q]] = this.stamp2; }
    if (b.threes(def) > 0) {
      const cells = b.n2;
      for (let i = 0; i < cells; i++) {
        if (b.c[i] === EMPTY && b.near[i] > 0 && mark2[i] !== this.stamp2 && b.makesFour(i, def)) opts[no++] = i;

  vcf(color, depth, top) {

        else res = b.fiveCells(color, new Int32Array(2)) > 0;
        b.undo();

      b.undo();
      if (this.timeUp) return false;
      if (res) { if (top) this.vcfMove = m; return true; }

}

/* ===== Zahájení Swap / Swap2 ===== */
const Opening = {
  BALANCED: 45,
  evalBlack(e, b, ms) {
    const r = e.think(b, ms, 8);
    const s = Math.max(-2000, Math.min(2000, r.score));
    return b.turn() === BLACK ? s : -s;
  },
  aiOpening(e, n, exactFive, tries, msEach) {
    const c = ((n / 2) | 0) * n + ((n / 2) | 0), mid = (n / 2) | 0;
    const ri = k => Math.floor(Math.random() * k);
    let best = null, bestKey = Infinity;
    for (let t = 0; t < tries; t++) {
      let w, b2;
      do { w = (mid + ri(5) - 2) * n + (mid + ri(5) - 2); } while (w === c);
      do { b2 = (mid + ri(7) - 3) * n + (mid + ri(7) - 3); } while (b2 === c || b2 === w);
      const b = new Board(n);
      b.exactFive = exactFive;
      b.place(c); b.place(w); b.place(b2);
      const key = Math.abs(Opening.evalBlack(e, b, msEach)) + ri(12);
      if (key < bestKey) { bestKey = key; best = [c, w, b2]; }
    }
    return best;
  },
  aiExtend(e, three, tries, msEach) {
    const cells = [];
    for (let i = 0; i < three.n2; i++) if (three.c[i] === EMPTY && three.near[i] > 0) cells.push(i);
    const ri = k => Math.floor(Math.random() * k);
    let best = null, bestKey = Infinity;
    for (let t = 0; t < tries; t++) {
      const w = cells[ri(cells.length)];
      let b2;
      do { b2 = cells[ri(cells.length)]; } while (b2 === w);
      const b = three.copy();
      b.place(w); b.place(b2);
      const key = Math.abs(Opening.evalBlack(e, b, msEach)) + ri(12);
      if (key < bestKey) { bestKey = key; best = [w, b2]; }
    }
    return best;
  }
};

/* ===== Rychlé úzké hledání (techniky převzaté z druhé aplikace: okna po 5 polích, seznamy čtyřek/trojek,
   VCF v listech pro obě strany, K tahů podle zbývající hloubky, sudé prohlubování, tabulka pozic) ===== */
const Fast = (function () {

// Jádro piškvorek: pozice, vyhledávání, zahájení swap a rozbor. Běží ve workeru i v testech.
const N = 15, NN = N * N, CENTER = 112;
const W = [0, 1, 10, 100, 1000, 100000];
const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const WIN = 1e7;
const winCells = [], winLine = [];
const cellWins = Array.from({ length: NN }, () => []);
(function () {
  for (let d = 0; d < 4; d++) {
    const dr = DIRS[d][0], dc = DIRS[d][1];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const er = r + 4 * dr, ec = c + 4 * dc;
        if (er < 0 || er >= N || ec < 0 || ec >= N) continue;
        const cells = [];
        for (let k = 0; k < 5; k++) cells.push((r + k * dr) * N + c + k * dc);
        const id = winCells.length;
        winCells.push(cells);
        const key = d === 0 ? r : d === 1 ? c : d === 2 ? r - c + N : r + c;
        winLine.push(d * 64 + key);
        for (const x of cells) cellWins[x].push(id);
      }
    }
  }
})();
const NW = winCells.length;

const NB2 = [], NB1 = [];
for (let i = 0; i < NN; i++) {
  const r = (i / N) | 0, c = i % N, l2 = [], l1 = [];
  for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue;
    l2.push(rr * N + cc);
    if (Math.abs(dr) <= 1 && Math.abs(dc) <= 1) l1.push(rr * N + cc);
  }
  NB2.push(Int16Array.from(l2)); NB1.push(Int16Array.from(l1));
}

// Zobristovy klíče
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;

const N15 = 15;

function fastThink(eng, b, m) {

  const f = new Int32Array(2);

  const stones = [];
  for (let k = 0; k < b.cnt; k++) stones.push({ i: b.hist[k], p: b.histCol[k] });
  const t0 = now();
  const r = Fast.thinkTimed(stones, stm, Math.max(200, Math.floor(ms * 0.75)), 18);
  if (!r || r.move < 0 || b.c[r.move] !== EMPTY) return eng.think(b, ms, m.maxDepth || 30);

  const out = { move: r.move, score: mate ? (r.value > 0 ? WIN - 40 : -(WIN - 40)) : Math.round(r.value * 0.65), depth: r.depth || 0, nodes: r.nodes || 0, mate };
  if (mate && r.value > 0) return out;

  eng.setup(b, Math.max(200, ms - (now() - t0)));
  const bb = eng.b;
  bb.place(r.move);
  let lose = false;
  if (!bb.wins(r.move)) {

    eng.vctBudget = 150000;
    lose = eng.vctAttack(opp, 8, false);

}

/* ---------- AI ve workeru (záložně v hlavním vlákně) ---------- */
const WORKER_BOOT = `
const eng = new Engine();
self.onmessage = function (e) {
  const m = e.data;
  const r = runTask(m.type, m, eng, function (p, t) { self.postMessage({ id: m.id, progress: p, total: t }); });
  self.postMessage({ id: m.id, result: r });
};`;
let worker = null, workerFailed = false, localEng = null, nextId = 1;
const pending = new Map();

function runLocal(item) {
  setTimeout(() => {
    if (!localEng) localEng = new E.Engine();
    item.res(E.runTask(item.type, Object.assign({}, item.payload), localEng, item.onProgress));
  }, 30);
}
function startWorker() {
  if (workerFailed) return;
  try {
    const blob = new Blob([ENGINE_SRC + WORKER_BOOT], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = ev => {
      const d = ev.data, p = pending.get(d.id);
      if (!p) return;
      if (d.progress !== undefined) { if (p.onProgress) p.onProgress(d.progress, d.total); return; }
      pending.delete(d.id);
      p.res(d.result);
    };
    worker.onerror = () => {
      workerFailed = true;
      worker = null;
      const items = Array.from(pending.values());
      pending.clear();
      items.forEach(runLocal);
    };
  } catch (e) { workerFailed = true; worker = null; }
}
function call(type, payload, onProgress) {
  return new Promise(res => {
    const id = nextId++;
    const item = { id, type, payload, res, onProgress };
    if (worker) { pending.set(id, item); worker.postMessage(Object.assign({ id, type }, payload)); }
    else runLocal(item);
  });
}
function cancelAll() {
  if (worker) { worker.terminate(); worker = null; pending.clear(); startWorker(); }
}
startWorker();

const colorName = c => (c === BLACK ? 'černý' : 'bílý');

function flat(b) { const a = []; for (let k = 0; k < b.cnt; k++) a.push(b.hist[k], b.histCol[k]); return a; }
function payload(b, extra) { return Object.assign({ stones: flat(b), stm: b.stm, exact: b.exactFive }, extra || {}); }
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
}
function show(name) {
  for (const s of ['menu', 'game', 'lab', 'pz']) $(s).classList.toggle('hidden', s !== name);
  window.scrollTo(0, 0);
}
function evalBlackText(scoreStm, stm, mate) {
  const bs = stm === BLACK ? scoreStm : -scoreStm;
  if (mate) {
    const plies = WINV - Math.abs(scoreStm);
    const moves = Math.max(1, Math.trunc((plies + 1) / 2));
    const winner = scoreStm > 0 ? stm : 3 - stm;
    return 'Vynucená výhra: ' + colorName(winner) + ' (asi za ' + moves + ' tahů).';
  }
  const a = Math.abs(bs);
  const size = a < 25 ? 'vyrovnáno' : a < 100 ? 'mírná výhoda' : a < 300 ? 'výrazná výhoda' : 'velká výhoda';
  const who = a < 25 ? '' : (bs > 0 ? ' černého' : ' bílého');
  return 'Černý ' + (bs > 0 ? '+' : '') + bs + ' – ' + size + who + '.';
}
const shortScore = s => (Math.abs(s) > WINV - 200 ? (s > 0 ? 'výhra' : 'prohra') : (s > 0 ? '+' : '') + s);

class BoardCanvas {
  constructor(canvas, onTap) {
    this.cv = canvas; this.board = null; this.showNumbers = true;
    this.hint = -1; this.marks = []; this.winLine = null;
    canvas.addEventListener('click', ev => {
      if (!this.board) return;
      const r = canvas.getBoundingClientRect(), n = this.board.n;
      const px = ev.clientX - r.left, py = ev.clientY - r.top;
      let x, y;
      if (set.style === 1) {                       // čtverce: pole je celý čtverec
        const s = r.width / (n + 1.1);
        x = Math.floor(px / s - 1); y = Math.floor(py / s - 1);
      } else {                                      // gomoku: kámen na průsečíku
        const step = r.width / (n + 1);
        x = Math.round(px / step) - 1; y = Math.round(py / step) - 1;
      }
      if (this.board.inside(x, y)) onTap(y * n + x);
    });
    window.addEventListener('resize', () => this.draw());
  }
  setBoard(b) { this.board = b; this.hint = -1; this.marks = []; this.winLine = null; this.draw(); }
  draw() {
    const cv = this.cv, b = this.board;
    if (!b) return;
    const w = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 320;
    const dpr = window.devicePixelRatio || 1;
    cv.style.height = w + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
    const ctx = cv.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = b.n, sq = set.style === 1;
    const s = sq ? w / (n + 1.1) : w / (n + 1);
    const P = (x, y) => (sq ? [s * (x + 1.5), s * (y + 1.5)] : [s * (x + 1), s * (y + 1)]);
    ctx.textAlign = 'center';
    if (sq) this.drawSquares(ctx, b, w, s, P); else this.drawGomoku(ctx, b, w, s, P);
    const r = s * (sq ? 0.4 : 0.46);
    if (this.hint >= 0) {
      const [cx, cy] = P(this.hint % n, (this.hint / n) | 0);
      ctx.strokeStyle = '#14a03c'; ctx.lineWidth = s * 0.12;
      ctx.beginPath();
      if (sq) ctx.rect(cx - s * 0.44, cy - s * 0.44, s * 0.88, s * 0.88); else ctx.arc(cx, cy, r * 0.95, 0, 7);

      const [x1, y1] = P(wl[0] + wl[2] * (wl[4] - 1), wl[1] + wl[3] * (wl[4] - 1));
      ctx.strokeStyle = sq ? '#2a9d3a' : '#e62828'; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round';

      const black = b.c[cell] === BLACK;
      ctx.fillStyle = black ? '#141414' : '#f8f8f8';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3c3c3c'; ctx.lineWidth = Math.max(1, step * 0.03);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
      const last = k === b.cnt - 1;
      if (this.showNumbers || last) {
        ctx.fillStyle = last ? '#e62828' : (black ? '#fff' : '#000');
        ctx.fillText(String(k + 1), cx, cy + step * 0.15);
      }
    }
  }
  drawSquares(ctx, b, w, s, P) {
    const n = b.n;
    ctx.fillStyle = '#fbfbf2'; ctx.fillRect(0, 0, w, w);
    const last = b.cnt > 0 ? b.hist[b.cnt - 1] : -1;
    if (last >= 0) {
      ctx.fillStyle = '#fff1a8';
      ctx.fillRect(s * ((last % n) + 1), s * (((last / n) | 0) + 1), s, s);
    }
    ctx.strokeStyle = '#8fb8e0'; ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const p = s * (i + 1);
      ctx.moveTo(s, p); ctx.lineTo(s * (n + 1), p);
      ctx.moveTo(p, s); ctx.lineTo(p, s * (n + 1));
    }
    ctx.stroke();
    ctx.fillStyle = '#6f87a3'; ctx.textAlign = 'center';
    ctx.font = (s * 0.4) + 'px sans-serif';
    for (let i = 0; i < n; i++) {
      ctx.fillText(String.fromCharCode(65 + i), s * (i + 1.5), s * 0.72);
      ctx.fillText(String(i + 1), s * 0.5, s * (i + 1.5) + s * 0.14);
    }
    ctx.lineCap = 'round';
    for (let k = 0; k < b.cnt; k++) {
      const cell = b.hist[k], x = cell % n, y = (cell / n) | 0;
      const [cx, cy] = P(x, y);
      ctx.lineWidth = s * 0.13;
      if (b.c[cell] === BLACK) {                 // modrý křížek
        const d = s * 0.29;
        ctx.strokeStyle = '#1f5fd1';
        ctx.beginPath();
        ctx.moveTo(cx - d, cy - d); ctx.lineTo(cx + d, cy + d);
        ctx.moveTo(cx - d, cy + d); ctx.lineTo(cx + d, cy - d);
        ctx.stroke();
      } else {                                    // červené kolečko
        ctx.strokeStyle = '#d62828';
        ctx.beginPath(); ctx.arc(cx, cy, s * 0.31, 0, 7); ctx.stroke();
      }
      if (this.showNumbers || k === b.cnt - 1) {
        ctx.fillStyle = '#556';
        ctx.font = (s * 0.3) + 'px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(String(k + 1), s * (x + 2) - s * 0.06, s * (y + 2) - s * 0.09);
        ctx.textAlign = 'center';
      }
    }
  }
}

/* =====================================================================
   HRA
   ===================================================================== */
const G = { board: null, phase: 'OVER', toPlace: 0, human: 0, playStart: 0, gen: 0, busy: false };
const gbc = new BoardCanvas($('g_canvas'), c => gCell(c));
const gStatus = t => { $('g_status').textContent = t; };
const gInfo = t => { $('g_info').textContent = t; };

function gHideChoice() { $('g_choice').classList.add('hidden'); }

function gNewGame() {
  G.gen++; cancelAll(); gHideChoice(); G.busy = false;
  G.board = new Board(N);
  G.board.exactFive = set.rules === 1;
  gbc.showNumbers = set.numbers;
  gbc.setBoard(G.board);
  G.human = 0;
  gInfo('');
  if (set.opening === 0) {
    const pref = set.color === 2 ? (Math.random() < 0.5 ? 0 : 1) : set.color;
    G.human = pref === 0 ? BLACK : WHITE;
    gStartPlay();
    return;
  }
  const humanIsA = set.role === 0 || (set.role === 2 && Math.random() < 0.5);
  if (humanIsA) {
    G.phase = 'OPEN_HUMAN';
    G.toPlace = 3;
    if (set.centerFirst) { G.board.place(CENTER); G.toPlace = 2; }
    gbc.draw();
    gRefreshStatus();
  } else {
    G.phase = 'OPEN_AI';
    gStatus('Soupeř (A) vybírá tři kameny zahájení…');
    const g = G.gen;
    call('aiOpening', { exact: G.board.exactFive, tries: 14, ms: 120 }).then(st => {
      if (g !== G.gen) return;
      for (const c of st) G.board.place(c);
      gbc.draw();
      gAskChoice();
    });
  }
}

function gStartFromPosition(stones, stm, human) {
  G.gen++; cancelAll(); gHideChoice(); G.busy = false;
  const b = new Board(N);
  b.exactFive = set.rules === 1;
  for (let k = 0; k < stones.length; k += 2) b.placeAs(stones[k], stones[k + 1]);
  b.setTurn(stm);
  G.board = b; G.human = human;
  gbc.showNumbers = set.numbers;
  gbc.setBoard(b);
  gInfo('');
  show('game');
  gStartPlay();
}

function gRefreshStatus() {
  if (G.phase === 'OPEN_HUMAN') {
    const next = G.board.cnt;
    const who = ['černý', 'bílý', 'černý', 'bílý', 'černý'];
    let msg = 'Zahájení: polož kámen č. ' + (next + 1) + ' (' + who[Math.min(next, 4)] + '). Zbývá: ' + G.toPlace + '.';
    if (next === 0 && set.centerFirst) msg += ' První kámen uprostřed.';
    gStatus(msg);
  } else if (G.phase === 'PLAY') {
    gStatus('Ty: ' + colorName(G.human) + '. ' + (G.board.turn() === G.human ? 'Jsi na tahu.' : 'AI přemýšlí…'));
  }
}

function gCell(cell) {
  const b = G.board;
  if (!b || b.c[cell] !== EMPTY || G.busy) return;
  if (G.phase === 'OPEN_HUMAN') {
    if (b.cnt === 0 && set.centerFirst && cell !== CENTER) { toast('První kámen musí být uprostřed.'); return; }
    b.place(cell);
    G.toPlace--;
    gbc.draw();
    if (G.toPlace === 0) gAfterHumanOpening(); else gRefreshStatus();
  } else if (G.phase === 'PLAY' && b.turn() === G.human) {
    gbc.hint = -1; gInfo('');
    b.place(cell);
    gbc.draw();
    if (!gCheckEnd(cell)) { gRefreshStatus(); gMaybeAi(); }
  }
}

function gCheckEnd(cell) {
  const b = G.board;
  if (b.wins(cell)) {
    G.phase = 'OVER';
    gbc.winLine = b.winLine(cell); gbc.draw();
    gStatus(b.c[cell] === G.human ? 'Vyhrál jsi! 🎉' : 'AI vyhrála. Zkus to znovu nebo si vyžádej Tip.');
    return true;
  }
  if (b.cnt >= N * N) { G.phase = 'OVER'; gStatus('Remíza – deska je plná.'); return true; }
  return false;
}

function gStartPlay() {
  G.phase = 'PLAY';
  G.playStart = G.board.cnt;
  gbc.draw();
  gRefreshStatus();
  gMaybeAi();
}

function gMaybeAi() {
  if (G.phase !== 'PLAY' || G.board.turn() === G.human || G.busy) return;
  G.busy = true;
  gStatus('Ty: ' + colorName(G.human) + '. AI přemýšlí…');
  const g = G.gen;
  call('think', payload(G.board, { ms: LEVEL_MS[set.level], maxDepth: 30 })).then(r => {
    if (g !== G.gen) return;
    G.busy = false;
    if (r.move < 0 || G.board.c[r.move] !== EMPTY) return;
    G.board.place(r.move);
    gbc.draw();
    if (!gCheckEnd(r.move)) gRefreshStatus();
  });
}

async function gAfterHumanOpening() {
  G.phase = 'AI_DECIDE';
  gStatus('Soupeř (B) se rozhoduje…');
  const g = G.gen, b = G.board;
  const three = b.cnt === 3, swap2 = set.opening === 2;
  const s = await call('evalBlack', payload(b, { ms: 1500 }));
  if (g !== G.gen) return;
  let choice;   // 0 = AI černý, 1 = AI bílý, 2 = AI přidá 2 kameny
  if (!three || !swap2) choice = s >= 0 ? 0 : 1;
  else if (s > Opening.BALANCED) choice = 0;
  else if (s < -Opening.BALANCED) choice = 1;
  else choice = 2;
  if (choice === 2) {
    const extra = await call('aiExtend', payload(b, { tries: 14, ms: 120 }));
    if (g !== G.gen) return;
    b.place(extra[0]); b.place(extra[1]);
    gbc.draw();
    gAskChoice();
  } else {
    const aiColor = choice === 0 ? BLACK : WHITE;
    G.human = 3 - aiColor;
    const how = three && swap2
      ? (choice === 0 ? 'Soupeř bere černého.' : 'Soupeř bere bílého a hraje 4. kámen.')
      : 'Soupeř si vybral barvu: ' + colorName(aiColor) + '.';
    toast(how + ' Ty jsi ' + colorName(G.human) + '.');
    gStartPlay();
  }
}

function gAskChoice() {
  G.phase = 'CHOOSE_HUMAN';
  gStatus('Vyber si barvu nebo možnost.');
  const canExtend = set.opening === 2 && G.board.cnt === 3;
  $('g_choice_title').textContent = G.board.cnt === 3
    ? 'Soupeř položil 3 kameny – vyber si:' : 'Soupeř přidal 2 kameny – vyber si barvu:';
  $('g_c2').classList.toggle('hidden', !canExtend);
  $('g_choice').classList.remove('hidden');
}
$('g_c0').onclick = () => { gHideChoice(); G.human = BLACK; gStartPlay(); };
$('g_c1').onclick = () => { gHideChoice(); G.human = WHITE; gStartPlay(); };
$('g_c2').onclick = () => {
  gHideChoice();
  G.phase = 'OPEN_HUMAN'; G.toPlace = 2;
  gRefreshStatus();
  gStatus('Polož 2 kameny: nejdřív bílý, pak černý. Potom soupeř zvolí barvu.');
};

function gUndo() {
  if (G.phase !== 'PLAY' && G.phase !== 'OVER') return;
  const b = G.board;
  if (b.cnt <= G.playStart) return;
  G.gen++; cancelAll(); G.busy = false;
  b.undo();
  while (b.cnt > G.playStart && b.turn() !== G.human) b.undo();
  G.phase = 'PLAY';
  gbc.winLine = null; gbc.hint = -1; gInfo('');
  gbc.draw();
  gRefreshStatus();
  gMaybeAi();
}

function describeForHuman(score, mate) {
  if (mate) {
    const moves = Math.max(1, Math.trunc((WINV - Math.abs(score) + 1) / 2));
    return score > 0 ? 'Máš vynucenou výhru (asi za ' + moves + ' tahů).'
      : 'Pozor: soupeř má vynucenou výhru, hledej obranu.';
  }
  const a = Math.abs(score);
  const size = a < 25 ? 'vyrovnáno' : a < 100 ? 'mírná výhoda' : a < 300 ? 'výrazná výhoda' : 'velká výhoda';
  const who = a < 25 ? '' : (score > 0 ? ' pro tebe' : ' pro soupeře');
  return 'Hodnocení: ' + size + who + ' (' + (score > 0 ? '+' : '') + score + ').';
}

function gHint() {
  if (G.phase !== 'PLAY' || G.busy || G.board.turn() !== G.human) return;
  G.busy = true;
  gInfo('Analyzuji pozici…');
  const g = G.gen;
  call('think', payload(G.board, { ms: Math.max(3000, LEVEL_MS[set.level]), maxDepth: 30 })).then(r => {
    if (g !== G.gen) return;
    G.busy = false;
    if (r.move < 0) return;
    gbc.hint = r.move; gbc.draw();
    gInfo('Tip: ' + cellName(r.move) + '  (hloubka ' + r.depth + ')\n' + describeForHuman(r.score, r.mate));
  });
}

$('g_undo').onclick = gUndo;
$('g_hint').onclick = gHint;
$('g_review').onclick = () => {
  if (!G.board || G.board.cnt === 0) return;
  G.gen++; cancelAll(); G.busy = false;
  labOpen(flat(G.board), true);
};
$('g_new').onclick = gNewGame;
$('g_menu').onclick = () => { G.gen++; cancelAll(); G.busy = false; show('menu'); };

/* =====================================================================
   VOLNÁ DESKA / ANALÝZA
   ===================================================================== */
const L = { board: null, moves: [], cursor: 0, forcedStm: 0, tool: 0, gen: 0, busy: false, rev: null,
  lines: [{ moves: [], cursor: 0 }], line: 0, revLine: 0 };
const activeRev = () => (L.line === L.revLine ? L.rev : null);
const lbc = new BoardCanvas($('l_canvas'), c => lCell(c));
const lInfo = t => { $('l_info').textContent = t; };
const TOOLS = ['Střídat', 'Černý', 'Bílý', 'Guma'];

function lSetTool(t) {
  L.tool = t;
  document.querySelectorAll('#l_tools button').forEach((b, i) => {
    b.textContent = i === t ? '[' + TOOLS[i] + ']' : TOOLS[i];
    b.classList.toggle('active', i === t);
  });
}

function lRebuild() {
  const b = new Board(N);
  b.exactFive = set.rules === 1;
  for (let k = 0; k < L.cursor; k++) b.placeAs(L.moves[k][0], L.moves[k][1]);
  b.setTurn(L.forcedStm || (L.cursor === 0 ? BLACK : 3 - L.moves[L.cursor - 1][1]));
  L.board = b;
  lbc.showNumbers = set.numbers;
  lbc.setBoard(b);
  lRefreshStatus();
  lAutoSchedule();
}
function lRefreshStatus() {
  $('l_status').textContent = 'Kamenů: ' + L.board.cnt + '   •   na tahu: ' + colorName(L.board.stm)
    + (L.lines.length > 1 ? '   •   větev ' + (L.line + 1) + '/' + L.lines.length : '');
  $('l_branch').textContent = 'Větev ' + (L.line + 1) + '/' + L.lines.length;
  $('l_stm').textContent = 'Na tahu: ' + colorName(L.board.stm);
}
function lClearReview() { L.rev = null; }

/* Změna tahů uprostřed partie nesmaže původní tahy: vznikne nová větev. */
function lFork() {
  L.lines[L.line].cursor = L.cursor;
  const nm = L.moves.slice(0, L.cursor);
  L.lines.push({ moves: nm, cursor: L.cursor });
  L.line = L.lines.length - 1;
  L.moves = nm;
  toast('Vznikla nová větev ' + (L.line + 1) + '. Původní tahy zůstaly – vrátíš se tlačítkem Původní.');
}
/* Před úpravou aktuální větve: uprostřed existující větve se vytvoří odbočka. */
function lPrepareEdit(forceFork) {
  if (forceFork || L.cursor < L.moves.length) lFork();
  else if (L.line === L.revLine) lClearReview();
}
function lSwitch(i) {
  if (L.busy || i === L.line || i < 0 || i >= L.lines.length) return;
  L.lines[L.line].cursor = L.cursor;
  L.line = i;
  L.moves = L.lines[i].moves;
  L.cursor = Math.min(L.lines[i].cursor, L.moves.length);
  L.forcedStm = 0;
  lRebuild();
  lShowReviewInfo();
  if (!activeRev()) lInfo((i === 0 ? 'Původní tahy' : 'Větev ' + (i + 1)) + ': ' + L.moves.length + ' tahů, zobrazeno ' + L.cursor + ' (tlačítko >| ukáže všechny).');
}

function labOpen(stones, review) {
  L.gen++; cancelAll(); L.busy = false;
  L.moves = []; L.cursor = 0; L.forcedStm = 0; L.rev = null;
  L.lines = [{ moves: L.moves, cursor: 0 }]; L.line = 0; L.revLine = 0;
  $('l_choice').classList.add('hidden');
  if (stones) { for (let k = 0; k < stones.length; k += 2) L.moves.push([stones[k], stones[k + 1]]); L.cursor = L.moves.length; L.lines[0].cursor = L.cursor; }
  lSetTool(0);
  show('lab');
  lRebuild();
  if (stones && review) lReview();
  else lInfo('Volná deska: klepni na pole pro kámen. Střídat = barvy se střídají, Černý/Bílý = libovolná barva, Guma = smaže kámen. Tlačítky < > se vracíš v tazích.');
}

function lCell(cell) {
  if (L.busy) return;
  lbc.marks = []; lbc.hint = -1;
  if (L.tool === 3) {
    for (let k = 0; k < L.cursor; k++) {
      if (L.moves[k][0] === cell) {
        lPrepareEdit(L.line === 0 || L.cursor < L.moves.length);
        L.moves.splice(k, 1); L.cursor--; L.forcedStm = 0;
        if (L.line === L.revLine) lClearReview();
        lRebuild(); lInfo('Kámen odstraněn.');
        return;
      }
    }
    lbc.draw();
    return;
  }
  if (L.board.c[cell] !== EMPTY) return;
  const color = L.tool === 1 ? BLACK : L.tool === 2 ? WHITE : L.board.stm;
  lPrepareEdit(false);
  L.moves.push([cell, color]);
  L.cursor++; L.forcedStm = 0;
  lRebuild();
  lInfo('');
  if (L.board.wins(cell)) {
    lbc.winLine = L.board.winLine(cell); lbc.draw();
    lInfo('Pětka v řadě – vyhrává ' + colorName(color) + '.');
  }
}

function lGoTo(k) {
  if (L.busy) return;
  L.cursor = Math.max(0, Math.min(L.moves.length, k));
  L.forcedStm = 0;
  lRebuild();
  lShowReviewInfo();
}
function lClear() {
  if (L.busy) return;
  const total = L.lines.reduce((a, l) => a + l.moves.length, 0);
  if (total > 0 && !window.confirm('Smazat celou desku včetně všech větví?')) return;
  L.gen++; cancelAll();
  L.moves = []; L.cursor = 0; L.forcedStm = 0; lClearReview();
  L.lines = [{ moves: L.moves, cursor: 0 }]; L.line = 0; L.revLine = 0;
  lRebuild(); lInfo('Deska vymazána.');
}
function lDeleteBranch() {
  if (L.busy) return;
  if (L.line === 0) { toast('Původní tahy se mažou tlačítkem Smazat.'); return; }
  const del = L.line;
  L.lines.splice(del, 1);
  if (L.revLine === del) { lClearReview(); L.revLine = 0; } else if (L.revLine > del) L.revLine--;
  L.line = 0; L.moves = L.lines[0].moves;
  L.cursor = Math.min(L.lines[0].cursor, L.moves.length);
  L.forcedStm = 0;
  lRebuild(); lShowReviewInfo();
  if (!activeRev()) lInfo('Větev ' + (del + 1) + ' smazána. Zobrazeny původní tahy.');
}
function lToggleStm() {
  if (L.busy) return;
  L.forcedStm = 3 - L.board.stm;
  lRebuild();
}
const analysisMs = () => Math.max(5000, LEVEL_MS[set.level]);

function lShowAnalysis(a, stm, auto) {
  if (!a.moves.length) { lInfo('Žádný tah k analýze.'); return; }
  lbc.marks = a.moves; lbc.draw();
  const parts = a.moves.map((m, k) => (k + 1) + '. ' + cellName(m) + ' (' + shortScore(a.scores[k]) + ')'
    + (a.equiv && a.equiv[k] && a.equiv[k].length ? ' = ' + a.equiv[k].map(cellName).join('/') : ''));
  lInfo(evalBlackText(a.scores[0], stm, a.mate) + '\nNejlepší tahy (' + colorName(stm) + '): ' + parts.join(',  ')
    + '\nHloubka ' + a.depth + (auto ? ' (auto).' : '.'));
}
function lAnalyze() {
  if (L.busy) return;
  L.autoSeq = (L.autoSeq || 0) + 1;
  L.busy = true; lbc.marks = []; lbc.draw();
  lInfo('Analyzuji pozici…');
  const g = L.gen, stm = L.board.stm;
  call('analyze', payload(L.board, { ms: analysisMs(), topK: 3 })).then(a => {
    if (g !== L.gen) return;
    L.busy = false;
    lShowAnalysis(a, stm, false);
  });
}
/* automatické zobrazování nejlepších tahů po každé změně pozice */
const autoMs = () => Math.max(1500, Math.round(LEVEL_MS[set.level] / 4));
function lAutoSchedule() {
  clearTimeout(L.autoT);
  L.autoSeq = (L.autoSeq || 0) + 1;
  if (!set.autoAnalysis || activeRev()) return;
  const s = L.autoSeq;
  L.autoT = setTimeout(() => {
    const b = L.board;
    if (s !== L.autoSeq || L.busy || !b) return;
    if ((b.cnt && b.wins(b.lastMove())) || b.cnt >= N * N) return;
    cancelAll();
    lInfo('Automatická analýza…');
    const stm = b.stm;
    call('analyze', payload(b, { ms: autoMs(), topK: 3 })).then(a => {
      if (s !== L.autoSeq || L.busy) return;
      lShowAnalysis(a, stm, true);
    });
  }, 450);
}
function lAutoLabel() { $('l_auto').textContent = 'Auto: ' + (set.autoAnalysis ? 'zap' : 'vyp'); $('l_auto').classList.toggle('active', !!set.autoAnalysis); }
$('l_auto').onclick = () => { set.autoAnalysis = !set.autoAnalysis; saveSet(); lAutoLabel(); lAutoSchedule(); if (!set.autoAnalysis) { cancelAll(); lbc.marks = []; lbc.draw(); lInfo(''); } };
lAutoLabel();

function lAiMove() {
  if (L.busy) return;
  L.busy = true; lbc.marks = []; lbc.draw();
  lInfo('AI přemýšlí…');
  const g = L.gen;
  call('think', payload(L.board, { ms: LEVEL_MS[set.level], maxDepth: 30 })).then(r => {
    if (g !== L.gen) return;
    L.busy = false;
    if (r.move < 0 || L.board.c[r.move] !== EMPTY) { lInfo('AI nemá tah.'); return; }
    const color = L.board.stm;
    lPrepareEdit(false);
    L.moves.push([r.move, color]);
    L.cursor++; L.forcedStm = 0;
    lRebuild();
    let txt = 'AI zahrála ' + cellName(r.move) + ' (hloubka ' + r.depth + ').';
    if (L.board.wins(r.move)) {
      lbc.winLine = L.board.winLine(r.move); lbc.draw();
      txt += ' Pětka – vyhrává ' + colorName(color) + '.';
    }
    lInfo(txt);
  });
}

/* ---------- rozbor partie ---------- */
function mistakeLabel(loss) {
  if (loss >= 700) return '?? hrubá chyba';
  if (loss >= 250) return '? chyba';
  if (loss >= 80) return '?! nepřesnost';
  return null;
}
function lReview() {
  if (L.busy) return;
  if (!L.moves.length) { toast('Nejdřív polož nějaké kameny.'); return; }
  L.busy = true; lbc.marks = []; lbc.hint = -1; lbc.draw();
  const g = L.gen, total = L.moves.length;
  const reviewLine = L.line;
  const stones = [];
  for (const m of L.moves) stones.push(m[0], m[1]);
  const ms = Math.min(1500, Math.max(700, Math.floor(LEVEL_MS[set.level] / 4)));
  lInfo('Rozbor partie: 0 / ' + (total + 1) + ' …');
  call('review', { stones, exact: set.rules === 1, ms }, (p, t) => {
    if (g === L.gen) lInfo('Rozbor partie: ' + p + ' / ' + t + ' …');
  }).then(r => {
    if (g !== L.gen) return;
    L.busy = false;
    L.rev = r; L.revLine = reviewLine;
    if (L.line === reviewLine) { L.cursor = L.moves.length; lRebuild(); lShowReviewSummary(); }
    else lInfo('Rozbor větve ' + (reviewLine + 1) + ' je hotov (zobrazí se po návratu na ni).');
  });
}
function lPositionEval() {
  const r = activeRev();
  if (!r || L.cursor >= r.score.length) return '';
  if (r.best[L.cursor] < 0) return 'Konec partie.';
  return evalBlackText(r.score[L.cursor], L.board.stm, Math.abs(r.score[L.cursor]) > WINV - 200);
}
function lShowBest() {
  const r = activeRev();
  lbc.marks = (r && L.cursor < r.best.length && r.best[L.cursor] >= 0) ? [r.best[L.cursor]] : [];
  lbc.draw();
}
/* ---------- statistika rozboru: šance na výhru, třídy tahů, přesnost, graf ---------- */
const PSCALE = 350;
const winProb = v => (v > WINV - 200 ? 1 : v < -WINV + 200 ? 0 : 1 / (1 + Math.exp(-v / PSCALE)));
const REV_CLS = ['nejlepší', 'výborný', 'dobrý', 'nepřesnost', 'chyba', 'hrubka'];
function revStats(r, moves) {
  if (r._st) return r._st;
  const n = moves.length, series = [], cls = [], acc = { 1: [], 2: [] }, counts = { 1: [0, 0, 0, 0, 0, 0], 2: [0, 0, 0, 0, 0, 0] };
  const bd = new Board(N);
  bd.exactFive = set.rules === 1;
  for (let k = 0; k <= n; k++) {
    const stm = k === 0 ? BLACK : 3 - moves[k - 1][1];
    let p;
    if (r.best[k] < 0) p = (k > 0 && bd.wins(moves[k - 1][0])) ? 0 : 0.5;
    else p = winProb(clampScore(r.score[k]));
    series.push(stm === BLACK ? p : 1 - p);
    if (k < n) bd.placeAs(moves[k][0], moves[k][1]);
  }
  for (let k = 0; k < n; k++) {
    const col = moves[k][1], stm = k === 0 ? BLACK : 3 - moves[k - 1][1];
    if (col !== stm || r.best[k] < 0) { cls.push(-1); continue; }
    const bs = clampScore(r.score[k]);
    const pB = winProb(bs), pP = winProb(bs - r.loss[k]);
    const loss = Math.max(0, pB - pP);
    const c = moves[k][0] === r.best[k] || r.loss[k] === 0 ? 0 : loss < 0.02 ? 1 : loss < 0.05 ? 2 : loss < 0.10 ? 3 : loss < 0.20 ? 4 : 5;
    cls.push(c); counts[col][c]++;
    acc[col].push(Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * loss * 100) - 3.1669)));
  }
  const accOf = a => {
    if (!a.length) return null;
    const mean = a.reduce((x, y) => x + y, 0) / a.length;
    const harm = a.length / a.reduce((x, y) => x + 1 / Math.max(1, y), 0);
    return Math.round((mean + harm) / 2 * 10) / 10;
  };
  return (r._st = { series, cls, counts, acc: { 1: accOf(acc[1]), 2: accOf(acc[2]) } });
}
const clampScore = v => Math.max(-WINV, Math.min(WINV, v));
function revSummaryText(r) {
  const st = revStats(r, L.moves), parts = [];
  for (const col of [BLACK, WHITE]) {
    const c = st.counts[col];
    if (st.acc[col] === null) continue;
    const bad = [];
    if (c[3]) bad.push(c[3] + '× nepřesnost');
    if (c[4]) bad.push(c[4] + '× chyba');
    if (c[5]) bad.push(c[5] + '× hrubka');
    parts.push((col === BLACK ? 'Černý' : 'Bílý') + ': přesnost ' + st.acc[col] + ' %' + (bad.length ? ' (' + bad.join(', ') + ')' : ''));
  }
  return parts.join('\n');
}
function lDrawGraph() {
  const cv = $('l_graph'), r = activeRev();
  if (!r || !L.moves.length) { cv.classList.add('hidden'); return; }
  cv.classList.remove('hidden');
  const st = revStats(r, L.moves), n = st.series.length;
  const w = cv.clientWidth || 320, h = 90, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const X = k => 6 + (w - 12) * (n <= 1 ? 0 : k / (n - 1)), Y = p => 4 + (h - 8) * (1 - p);
  ctx.fillStyle = 'rgba(40,40,40,0.08)'; ctx.fillRect(0, h / 2, w, h / 2);
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
  ctx.strokeStyle = '#2a6fdb'; ctx.lineWidth = 2; ctx.beginPath();
  for (let k = 0; k < n; k++) { if (k === 0) ctx.moveTo(X(k), Y(st.series[k])); else ctx.lineTo(X(k), Y(st.series[k])); }
  ctx.stroke();
  const colors = ['', '', '', '#e6a100', '#e0701a', '#d62828'];
  for (let k = 0; k < st.cls.length; k++) if (st.cls[k] >= 3) { ctx.fillStyle = colors[st.cls[k]]; ctx.beginPath(); ctx.arc(X(k + 1), Y(st.series[k + 1]), 3.2, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(L.cursor), 0); ctx.lineTo(X(L.cursor), h); ctx.stroke();
}
$('l_graph').addEventListener('click', ev => {
  const r = activeRev(); if (!r || L.busy) return;
  const rect = $('l_graph').getBoundingClientRect(), n = L.moves.length + 1;
  const k = Math.round(((ev.clientX - rect.left) - 6) / (rect.width - 12) * (n - 1));
  lGoTo(k);
});

function lShowReviewSummary() {
  const count = L.rev.loss.filter(x => x >= 250).length;
  lInfo('Rozbor hotov. ' + (count === 0 ? 'Žádné výrazné chyby.' : 'Výrazných chyb: ' + count + '. Tlačítkem „Chyba >“ je projdeš.')
    + '\n' + revSummaryText(L.rev) + '\n' + lPositionEval());
  lShowBest();
  lDrawGraph();
}
function lShowReviewInfo() {
  lbc.marks = []; lbc.draw();
  const r = activeRev();
  if (!r) { lInfo(''); $('l_graph').classList.add('hidden'); return; }
  let s = '';
  if (L.cursor > 0) {
    const m = L.cursor - 1, label = mistakeLabel(r.loss[m]);
    s += 'Tah ' + L.cursor + ' (' + colorName(L.moves[m][1]) + ') ' + cellName(L.moves[m][0]);
    if (label) { s += ': ' + label; if (r.best[m] >= 0) s += ', lepší bylo ' + cellName(r.best[m]); }
    else s += ': v pořádku';
    s += '.\n';
  }
  s += lPositionEval();
  if (L.cursor < r.best.length && r.best[L.cursor] >= 0) s += '\nZeleně: nejlepší pokračování ' + cellName(r.best[L.cursor]) + '.';
  const st = revStats(r, L.moves);
  s += '\nŠance černého na výhru: ' + Math.round(st.series[Math.min(L.cursor, st.series.length - 1)] * 100) + ' %';
  lInfo(s);
  lShowBest();
  lDrawGraph();
}
function lNextMistake() {
  if (L.busy) return;
  const rv = activeRev();
  if (!rv) { toast('Nejdřív spusť Rozbor.'); return; }
  for (let m = L.cursor; m < rv.loss.length; m++) {
    if (rv.loss[m] >= 250) { L.cursor = m + 1; L.forcedStm = 0; lRebuild(); lShowReviewInfo(); return; }
  }
  toast('Další výrazná chyba už není.');
}

/* ---------- dohrát odtud ---------- */

  if (L.busy) return;

}

  gStartFromPosition(flat(L.board), L.board.stm, human);
}

/* =====================================================================
   PUZZLY – vynucená výhra
   ===================================================================== */
const PZ_LEVELS = ['Lehké (3–4 tahy)', 'Střední (5)', 'Těžké (6–7)', 'Expert (8+)'];
const PZ_RANGE = [[1, 4], [5, 5], [6, 7], [8, 12]];
const PZ = { lvl: 0, idx: 0, board: null, att: BLACK, left: 0, busy: false, over: false, gen: 0, cur: null, order: {}, done: {} };
try { Object.assign(PZ.done, JSON.parse(localStorage.getItem('pt_pzdone') || '{}')); PZ.genSolved = +(localStorage.getItem('pt_pzgen') || 0); } catch (e) { /* nic */ }
const pbc = new BoardCanvas($('p_canvas'), c => pCell(c));
pbc.showNumbers = false;
const pStatus = t => { $('p_status').textContent = t; };
const pInfo = t => { $('p_info').textContent = t; };
const pzList = lvl => PUZZLES.filter(p => p.d >= PZ_RANGE[lvl][0] && p.d <= PZ_RANGE[lvl][1]);
function pzSaveDone() { try { localStorage.setItem('pt_pzdone', JSON.stringify(PZ.done)); } catch (e) { /* nic */ } }

function pzLoad() {
  const list = pzList(PZ.lvl);
  for (let i = 0; i < 4; i++) $('p_l' + i).classList.toggle('active', i === PZ.lvl);
  if (!list.length) { pStatus('V této úrovni zatím nejsou úlohy.'); pInfo(''); pbc.setBoard(null); return; }
  if (!PZ.order[PZ.lvl]) PZ.order[PZ.lvl] = list.map((_, i) => i).sort(() => Math.random() - 0.5);
  const ord = PZ.order[PZ.lvl];
  // preferuj nevyřešené
  let pick = -1;
  for (let k = 0; k < ord.length; k++) { const i = ord[(PZ.idx + k) % ord.length]; if (!PZ.done[list[i].id]) { pick = (PZ.idx + k) % ord.length; break; } }
  if (pick < 0) pick = PZ.idx % ord.length;
  PZ.idx = pick;
  const solved = Object.keys(PZ.done).filter(id => list.some(q => q.id === id)).length;
  pzStart(list[ord[pick]], 'Úloha ' + (pick + 1) + '/' + list.length + ' · vyřešeno ' + solved);
}
function pzStart(p, tag) {
  PZ.gen++; cancelAll(); PZ.busy = false; PZ.over = false;
  PZ.cur = p; PZ.att = p.att; PZ.left = p.d; PZ.tag = tag || PZ.tag;
  const b = new Board(N);
  for (let k = 0; k < p.s.length; k += 2) b.placeAs(p.s[k], p.s[k + 1]);
  b.setTurn(p.att);
  PZ.board = b;
  pbc.setBoard(b);
  pStatus(colorName(p.att).replace(/^./, c => c.toUpperCase()) + ' hraje a vynuceně vyhraje nejvýše za ' + p.d + ' ' + (p.d === 1 ? 'tah' : p.d < 5 ? 'tahy' : 'tahů') +
    ' (včetně pětky).');
  pInfo(PZ.tag + '\nTahat můžeš čtyřkami i trojkami; soupeř se brání nejlépe, jak umí.');
}

/* náhodná transformace knihovní úlohy (otočení/zrcadlo, posun, prohození barev) */
function pzVariant(p) {
  const t = Math.floor(Math.random() * 8), swap = Math.random() < 0.5;
  const tr = c => { const x = c % N, y = (c / N) | 0, m = N - 1;
    const [a, b] = [[x, y], [m - y, x], [m - x, m - y], [y, m - x], [m - x, y], [x, m - y], [y, x], [m - y, m - x]][t]; return [a, b]; };
  const pts = []; for (let k = 0; k < p.s.length; k += 2) pts.push(tr(p.s[k]));
  const minx = Math.min(...pts.map(q => q[0])), maxx = Math.max(...pts.map(q => q[0]));
  const miny = Math.min(...pts.map(q => q[1])), maxy = Math.max(...pts.map(q => q[1]));
  const dx = Math.floor(Math.random() * (N - (maxx - minx))) - minx, dy = Math.floor(Math.random() * (N - (maxy - miny))) - miny;
  const s = [];
  for (let k = 0; k < p.s.length; k += 2) { const q = pts[k / 2]; s.push((q[1] + dy) * N + q[0] + dx, swap ? 3 - p.s[k + 1] : p.s[k + 1]); }
  return { id: null, d: p.d, att: swap ? 3 - p.att : p.att, s, theme: p.theme, idea: p.idea };
}
const PZ_GEN = [{ d: [2, 3], ms: 4000 }, { d: [4, 4], ms: 6000 }, { d: [5, 6], ms: 12000 }, { d: [7, 8], ms: 25000 }];
function pzGenerate() {
  if (PZ.busy && PZ.generating) return;
  PZ.gen++; cancelAll(); PZ.busy = true; PZ.generating = true; PZ.over = false;
  const g = PZ.gen, cfg = PZ_GEN[PZ.lvl];
  const d = cfg.d[Math.random() < (PZ.lvl === 0 ? 0.35 : 0.65) ? 0 : 1];
  pStatus('Generuji novou úlohu…'); pInfo('Hledám pozici s vynucenou výhrou, může to chvíli trvat.');
  call('pzGen', { seed: (Math.random() * 1e9) | 0, dmin: d, dmax: d, ms: cfg.ms }).then(r => {
    if (g !== PZ.gen) return;
    PZ.generating = false;
    if (!r) {
      const list = pzList(PZ.lvl);
      if (!list.length) { PZ.busy = false; pStatus('Nepodařilo se vygenerovat úlohu.'); return; }
      const v = pzVariant(list[Math.floor(Math.random() * list.length)]);
      pzStart(v, 'Varianta úlohy z knihovny (otočená a posunutá)');
      return;
    }
    pzStart({ id: null, d: r.d, att: r.att, s: r.s, theme: r.theme, idea: r.idea }, 'Nová náhodná úloha · vyřešeno v generátoru ' + (PZ.genSolved || 0));
  });
}
$('p_gen').onclick = pzGenerate;

function pzNext() { PZ.idx++; pzLoad(); }
function pzWin(cell) {
  PZ.over = true;
  pbc.winLine = PZ.board.winLine(cell); pbc.draw();
  if (PZ.cur.id) { PZ.done[PZ.cur.id] = 1; pzSaveDone(); } else { PZ.genSolved = (PZ.genSolved || 0) + 1; try { localStorage.setItem('pt_pzgen', String(PZ.genSolved)); } catch (e) { /* nic */ } }
  pStatus('Výborně, vyřešeno! 🎉');
  pInfo((PZ.cur.theme ? 'Motiv: ' + PZ.cur.theme + '\n' + PZ.cur.idea + '\n' : '') + 'Další úloha tlačítkem Další nebo Generovat.');
}
function pCell(cell) {
  const b = PZ.board;
  if (!b || PZ.busy || PZ.over || b.c[cell] !== EMPTY) return;
  PZ.busy = true; pbc.hint = -1;
  const g = PZ.gen;
  pInfo('Kontroluji tah…');
  call('pzCheck', { stones: flat(b), stm: b.stm, att: PZ.att, d: PZ.left, move: cell }).then(r => {
    if (g !== PZ.gen) return;
    if (!r || !r.ok) { PZ.busy = false; pInfo('Tenhle tah vynucenou výhru v daném počtu tahů nedrží. Zkus jiný.'); toast('Nevede k vynucené výhře.'); return; }
    b.placeAs(cell, PZ.att); b.setTurn(3 - PZ.att);
    pbc.draw();
    if (r.five) { PZ.busy = false; pzWin(cell); return; }
    PZ.left--;
    pzReplyNow(g, false);
  });
}
function pzReplyNow(g, auto) {
  const b = PZ.board;
  pInfo('Soupeř odpovídá…');
  return call('pzReply', { stones: flat(b), stm: b.stm, att: PZ.att, d: PZ.left }).then(r => {
    if (g !== PZ.gen) return;
    if (r && r.move >= 0) { b.placeAs(r.move, 3 - PZ.att); b.setTurn(PZ.att); pbc.draw(); }
    PZ.busy = false;
    pInfo(auto ? '' : 'Soupeř hrál ' + cellName(r.move) + '. Pokračuj, zbývá nejvýše ' + PZ.left + ' tahů.');
  });
}
$('p_hint').onclick = () => {
  const b = PZ.board;
  if (!b || PZ.busy || PZ.over) return;
  PZ.busy = true; const g = PZ.gen; pInfo('Hledám tah…');
  call('pzHint', { stones: flat(b), stm: b.stm, att: PZ.att, d: PZ.left }).then(r => {
    if (g !== PZ.gen) return;
    PZ.busy = false;
    if (!r || !r.moves || !r.moves.length) { pInfo('Tip se nepodařilo najít.'); return; }
    pbc.hint = r.moves[0]; pbc.draw();
    pInfo('Tip: zahraj ' + cellName(r.moves[0]) + '.');
  });
};
$('p_solve').onclick = async () => {
  const b = PZ.board;
  if (!b || PZ.busy || PZ.over) return;
  PZ.busy = true; const g = PZ.gen; pInfo('Přehrávám řešení…');
  while (PZ.left >= 1 && g === PZ.gen) {
    const r = await call('pzHint', { stones: flat(b), stm: b.stm, att: PZ.att, d: PZ.left });
    if (g !== PZ.gen) return;
    if (!r || !r.moves || !r.moves.length) break;
    const c = r.moves[0];
    b.placeAs(c, PZ.att); b.setTurn(3 - PZ.att); pbc.draw();
    if (b.wins(c)) { pbc.winLine = b.winLine(c); pbc.draw(); PZ.over = true; break; }
    PZ.left--;
    await new Promise(res => setTimeout(res, 500));
    await pzReplyNow(g, true);
    if (g !== PZ.gen) return;
    PZ.busy = true;
    await new Promise(res => setTimeout(res, 500));
  }
  PZ.busy = false; PZ.over = true;
  pStatus('Řešení přehráno.'); pInfo('Zkus další úlohu.');
};
$('p_again').onclick = () => { if (PZ.cur) pzStart(PZ.cur); };
$('p_next').onclick = pzNext;
$('p_menu').onclick = () => { PZ.gen++; cancelAll(); PZ.busy = false; show('menu'); };
for (let i = 0; i < 4; i++) $('p_l' + i).onclick = () => { PZ.lvl = i; PZ.idx = 0; pzLoad(); };
$('b_pz').onclick = () => { readMenu(); show('pz'); pzLoad(); };
